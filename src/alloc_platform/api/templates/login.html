{% extends "base.html" %}
{% block title %}Login - Alloc Platform{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
  <div class="card">
    <h3 style="margin-bottom: 1.5rem; text-align: center;">Sign In to Console</h3>
    {% if error %}
      <div style="background-color: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.85rem;">
        {{ error }}
      </div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center;">
        Log In
      </button>
    </form>
  </div>
</div>
{% endblock %}
